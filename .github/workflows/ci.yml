name: CI

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_call:

env:
  # Numéro d'équipe : la remise doit s'appeler Client-eq200.jar
  TEAM: XXX
  JAVA_VERSION: '25'
  JUNIT_VERSION: 6.1.3
  TYPST_VERSION: 0.15.1
  GJF_VERSION: 1.28.0

jobs:
  java:
    name: Java (format, compilation, tests, jar)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Check formatting (google-java-format --aosp)
        shell: bash
        run: |
          JAR="google-java-format-${GJF_VERSION}-all-deps.jar"
          curl -fsSL -o "$JAR" \
            "https://github.com/google/google-java-format/releases/download/v${GJF_VERSION}/${JAR}"
          java \
            --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
            --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
            --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
            --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
            --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
            --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
            -jar "$JAR" --aosp --dry-run --set-exit-if-changed \
            $(find src test benchmark -name '*.java')

      - name: Compile sources
        run: javac -encoding UTF-8 -d bin src/*.java

      - name: Run unit tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(test/*.java)
          if (( ${#tests[@]} == 0 )); then
            echo "::notice::Aucun test unitaire dans test/"
            exit 0
          fi

          JAR="junit-platform-console-standalone-${JUNIT_VERSION}.jar"
          curl -fsSL -o "$JAR" \
            "https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/${JUNIT_VERSION}/${JAR}"

          javac -encoding UTF-8 -d bin-test -cp "bin:$JAR" "${tests[@]}"
          java -jar "$JAR" execute -cp bin:bin-test --scan-class-path --fail-if-no-tests=false

      - name: Build Client-eq${{ env.TEAM }}.jar
        run: |
          mkdir -p dist
          jar --create --file "dist/Client-eq${TEAM}.jar" --main-class Client -C bin .

      - name: Smoke test (2 parties contre random dans l'arène)
        # Vérifie que le jar se connecte, joue des coups valides dans le temps imparti et
        # enchaîne plusieurs parties. À rendre bloquant (retirer continue-on-error) dès que
        # Client.java joue seul au lieu d'attendre la saisie clavier.
        continue-on-error: true
        run: |
          javac -encoding UTF-8 -d bin-arena benchmark/*.java
          java -cp bin-arena Arena --games 2 --time 1000 --strict \
            "dist/Client-eq${TEAM}.jar" random

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: client-jar
          path: dist/Client-eq${{ env.TEAM }}.jar
          if-no-files-found: error

  typst:
    name: Typst (rapport)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Compile report
        run: typst compile --root . remise/rapport.typ remise/rapport.pdf

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: rapport-pdf
          path: remise/rapport.pdf
          if-no-files-found: error
